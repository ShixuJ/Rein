<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>rein</title>
    <style>
      /* 主题用半透明灰而非写死的色值：宿主面板的底色不由我们定，灰在两个主题下都能落住。
         唯一的彩色是强调色与"退休"的红——后者是因为退休不可逆，值得一个警告性的样子。

         尺寸都走这几组令牌：字号四档（14/13/12/11）、间距只用 4/6/8/12/16/24、
         圆角三档。样式表里冒出 13.5px 或 27px 这种数，就是令牌不够用了，别就地加一个新的。 */
      :root {
        color-scheme: light dark;
        --line: rgba(127, 127, 127, 0.28);
        --line-strong: rgba(127, 127, 127, 0.48);
        --fill: rgba(127, 127, 127, 0.10);
        --fill-strong: rgba(127, 127, 127, 0.20);

        /* 实心填充需要一对（底 + 压在上面的字）：深色主题的强调色是浅蓝，
           白字会糊在上面，所以墨色跟着主题一起翻。 */
        --accent: #3f6fe0;
        --accent-ink: #ffffff;
        --accent-hover: #3560c9;
        --accent-soft: rgba(63, 111, 224, 0.14);
        --accent-tint: rgba(63, 111, 224, 0.28);
        /* 强调色当字色时要更深一档：#3f6fe0 压在 14% 的自己身上只有 3.9:1，
           不到 AA 的 4.5:1。深一档是 5.2:1，还是同一支蓝。 */
        --accent-text: #2257d3;

        /* 比"好看的红"再深一档：#c0392b 压在软红底上，宿主底若是浅灰就只有 4.21:1。
           深一档两种底都过 4.5:1，实心红按钮上的白字反而更稳（6.3:1）。 */
        --danger: #b42d1f;
        --danger-ink: #ffffff;
        --danger-hover: #9e2618;
        --danger-soft: rgba(180, 45, 31, 0.10);
        --danger-tint: rgba(180, 45, 31, 0.20);
        --danger-line: rgba(180, 45, 31, 0.42);

        --t-title: 14px;
        --t-body: 13px;
        --t-small: 12px;
        --t-micro: 11px;

        --r-chip: 6px;   /* 贴着字的小块：编号、代码 */
        --r-ctl: 8px;    /* 控件：按钮、输入框、提示块 */
        --r-card: 12px;  /* 容器：条目卡、空状态 */
        --r-pill: 999px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #8fb0ff;
          --accent-ink: #101625;
          --accent-hover: #a5c1ff;
          --accent-soft: rgba(143, 176, 255, 0.16);
          --accent-tint: rgba(143, 176, 255, 0.30);
          /* 深色底上浅蓝本来就有 5.9:1，不用再深一档。 */
          --accent-text: #8fb0ff;
          --danger: #ff9a8f;
          --danger-ink: #2a1512;
          --danger-hover: #ffb3aa;
          --danger-soft: rgba(255, 154, 143, 0.14);
          --danger-tint: rgba(255, 154, 143, 0.26);
          --danger-line: rgba(255, 154, 143, 0.40);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 16px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: var(--t-body);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: center; gap: 8px; }
      .mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: var(--r-ctl);
        background: var(--accent-soft);
        color: var(--accent);
        flex: none;
      }
      h1 { font-size: var(--t-title); font-weight: 600; margin: 0; flex: 1; letter-spacing: 0.01em; }
      /* 一级标题：生效中 / 已失效。它是这份列表的骨架，所以得比下面那层小标题明显一档——
         抬到正文字号、几乎全墨，扫一眼就能找到"账本长到这里了"。 */
      h2 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--t-body);
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0.9;
        margin: 24px 0 8px;
      }
      h2 .n {
        font-variant-numeric: tabular-nums;
        letter-spacing: normal;
        font-size: var(--t-micro);
        padding: 1px 6px;
        border-radius: var(--r-pill);
        background: var(--fill);
        opacity: 0.9;
      }
      h2 .n:empty { display: none; }
      /* 标题行：左边架子名、右边这一层的动作。动作贴着它要作用的那份列表，不另起一行飘着。 */
      .head { display: flex; align-items: center; gap: 8px; margin: 24px 0 8px; }
      .head h2 { margin: 0; flex: 1; }
      /* 已失效是账本的另一层架子，不是接着往下读的同类内容：给一条分隔线，顺手减掉标题的上边距。 */
      #inactiveSection { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
      #inactiveSection .head { margin-top: 0; }
      .counts {
        font-size: var(--t-micro);
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .counts[hidden] { display: none; }
      #full[hidden] { display: none; }

      .notice {
        margin: 12px 0 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--fill);
        font-size: var(--t-small);
        word-break: break-word;
      }
      .notice[hidden] { display: none; }

      /* 这块面板看的是哪个项目。从侧栏入口进来时没人把项目根递过来（server 是按
         "最近一次提问的项目"认的），所以必须写在明面上——不然换个项目打开，看到的是
         另一个项目的条目，而面板上没有任何线索。 */
      .where {
        margin: 0;
        font-size: var(--t-small);
        opacity: 0.7;
        word-break: break-all;
      }
      .where[hidden] { display: none; }
      .where #switchProject { margin-left: 6px; }

      /* 项目切换：猜不准时摆出来的选项，横着排。 */
      .pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
      .pick[hidden] { display: none; }

      /* 两本账：同时只看得见一页。页签只在展开态里——收起时那张小卡片摆不下它。 */
      .tabs { display: flex; gap: 6px; margin: 0 0 10px; }
      .tabs button { flex: 1; padding: 6px 8px; }
      .tabs button.on {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }

      /* 二级标题：生效中里面的两组（通用账本 / 本项目）。它比一级小一档、淡一档，右边还拖
          一条细线——线是"这一组从这儿起"的记号，也顺手跟上一组分开。
          只有真的存在引来的条目时才画，全是自己的条目时不写（见 renderProjectPage）。 */
      .group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--t-micro);
        font-weight: 600;
        letter-spacing: 0.04em;
        opacity: 0.7;
        margin: 12px 0 6px;
      }
      .group::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .group:first-child { margin-top: 0; }

      /* 分组标题行：小标题在左、这一组的动作在右（「直接写一条」的加号）。间距跟着分组走，
         不跟着 section 走——它是二级标题那一层的东西。 */
      .groupRow { margin: 12px 0 6px; }
      .groupRow .group { flex: 1; margin: 0; }
      .groupRow:first-child { margin-top: 0; }

      /* 「已失效」的折叠三角，默认收起来。它坐在标题左边，所以必须是描边的——
         这个面板里描边的都能按，不描边的都是信息。三角朝右=收着，转 90° 朝下=开着，
         一个 transform 就够，不用换字形（状态就在 aria-expanded 上，顺手也是给读屏器的）。 */
      .fold {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        padding: 0;
        flex: none;
        border-radius: var(--r-pill);
        font-size: 10px;
        line-height: 1;
        opacity: 0.8;
        transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease,
          color 0.12s ease, opacity 0.12s ease;
      }
      .fold[aria-expanded="true"] { transform: rotate(90deg); }
      .fold:hover:not(:disabled) { opacity: 1; }

      .item {
        position: relative;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        margin-bottom: 8px;
        word-break: break-word;
      }
      .item.editing {
        border-color: var(--accent);
        background: var(--fill);
        box-shadow: 0 0 0 2px var(--accent-tint);
      }
      .item.inactive {
        border-style: dashed;
        opacity: 0.8;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: var(--t-micro);
        margin-bottom: 8px;
      }
      .meta .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        padding: 2px 6px;
        border-radius: var(--r-chip);
        background: var(--fill);
      }
      /* 类型与状态是"信息"不是"按钮"。这个面板里描边的都能按，所以它们用底色，不描边。 */
      .meta .type,
      .meta .state {
        padding: 2px 8px;
        border-radius: var(--r-pill);
        background: var(--fill);
        opacity: 0.85;
      }
      /* 从通用账本引来的那条：类型那一格换成蓝色系，扫一眼就分得出。它说的是跟旁边那个
         分组小标题同一件事——这条不属这里。 */
      .meta .type.foreign {
        background: var(--accent-soft);
        color: var(--accent-text);
        opacity: 1;
      }
      .meta .date {
        /* 日期推到最右：几张卡的日期对齐成一竖条，扫起来才不用跟着标签跑。 */
        margin-left: auto;
        /* 0.66 压到失效卡片上只剩 4.39:1（卡片自己也带 0.8）——小字最低 4.5:1，所以抬到 0.7。 */
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }

      .statement { margin: 0; overflow-wrap: anywhere; }

      /* 原文：这条结论当初从哪来。左侧一道竖线当引用，别做成又一张卡片——它挂在条目下面。 */
      .origin {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-left: 3px solid var(--line-strong);
        background: var(--fill);
        border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
        font-size: var(--t-small);
        line-height: 1.5;
        opacity: 0.9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
      button {
        font-family: inherit;
        font-size: var(--t-small);
        line-height: 1.2;
        font-weight: 500;
        padding: 5px 12px;
        border-radius: var(--r-ctl);
        border: 1px solid var(--line-strong);
        background: transparent;
        color: inherit;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      }
      button:hover:not(:disabled) { background: var(--fill-strong); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      /* 一张表单里只有一个实心按钮，它是"这条就这么定"。面板其余部分是灰的，所以它一眼就能找到。 */
      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) { background: var(--accent-hover); }
      /* 「修改」是每张卡片上最常按的一颗，所以给它蓝色系——一列卡片扫过去，蓝的那颗就是能动的。
         但仍然不做实心：实心留给"就这么定"（取代／写进账本／确认归档），
         否则一列卡片站满蓝块，重点反而没了。 */
      button.edit {
        color: var(--accent-text);
        border-color: var(--accent-text);
        background: var(--accent-soft);
        font-weight: 600;
      }
      button.edit:hover:not(:disabled) { background: var(--accent-tint); }
      /* 「退休」常驻一层浅红（底色 + 描边 + 字色）：不可逆的动作要一眼认得出，不能靠悬停才现形。
         但它始终是"浅"的——深红实心留给真按下去那一步（.armed 的「确认退休」），
         不然每张卡片上会站着一颗比「修改」更抢眼的红按钮，重点反而没了。 */
      button.danger {
        color: var(--danger);
        border-color: var(--danger-line);
        background: var(--danger-soft);
      }
      /* 悬停只加深一档底色——和「修改」那颗一个节奏（soft → tint），别再加别的变化。 */
      button.danger:hover:not(:disabled) { background: var(--danger-tint); }
      button.danger.armed {
        opacity: 1;
        border-color: transparent;
        background: var(--danger);
        color: var(--danger-ink);
        font-weight: 600;
      }
      button.danger.armed:hover:not(:disabled) { background: var(--danger-hover); }
      /* 停用态一票否决，写在各个变体后面：不能按的按钮不该比能按的更显眼。
         只有 .armed 要单独点出来——两个类压得过 button:disabled，其余变体都压不过。 */
      button:disabled,
      button.danger.armed:disabled { opacity: 0.45; cursor: default; }
      button.tiny { font-size: var(--t-micro); padding: 3px 10px; border-radius: var(--r-pill); }
      /* 「原文」推到这一行的最右边：它只读不写，跟「修改 / 退休」不是一类动作——隔开一个身位，
         顺手点「退休」的时候不容易误碰它。 */
      button.end { margin-left: auto; }
      #expand, #refresh { flex: none; }
      /* 加一条用加号，不用文字：它坐在自己那份列表的标题行上。悬停给文字、读屏器读 aria-label——
         图标按钮不能没有名字。 */
      .add {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        flex: none;
        border-radius: var(--r-pill);
        color: inherit;
        opacity: 0.75;
      }
      .add:hover:not(:disabled) {
        opacity: 1;
        color: var(--accent-text);
        border-color: var(--accent-text);
        background: var(--accent-soft);
      }
      /* 刷新是按钮，就得长成按钮：留边框、留悬停底色，图形换成箭头，占位和标题左边的标记一样大。 */
      #refresh {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        opacity: 0.8;
      }
      #refresh:hover:not(:disabled) { opacity: 1; }
      #refresh:disabled { opacity: 0.45; }

      /* 这里现在只放确认块：触发按钮都上了标题行，不用再给按钮做右对齐。 */
      .bulk { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
      .bulk[hidden] { display: none; }
      .bulk .warn { margin-top: 0; }

      .note {
        margin: 0;
        font-size: var(--t-small);
        line-height: 1.5;
        opacity: 0.85;
      }

      .aside {
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-ctl);
        font-size: var(--t-small);
        line-height: 1.5;
      }
      .aside[hidden] { display: none; }
      /* 钩子没在跑是这块面板里唯一会静默坏掉的东西：给它实底加色，别混在灰色注脚里等用户自己发现。 */
      .aside.alert {
        border-style: solid;
        border-color: var(--danger-line);
        background: var(--danger-soft);
        color: var(--danger);
      }

      .warn {
        display: flex;
        gap: 6px;
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: var(--r-ctl);
        background: var(--danger-soft);
        font-size: var(--t-small);
        line-height: 1.5;
        color: var(--danger);
      }
      /* 不可逆的事不能只靠颜色说：给一个标记，色盲和灰度屏上也读得到。 */
      .warn::before {
        content: "!";
        flex: none;
        width: 16px;
        height: 16px;
        margin-top: 1px;
        border-radius: var(--r-pill);
        background: var(--danger);
        color: var(--danger-ink);
        font-size: var(--t-micro);
        font-weight: 700;
        line-height: 16px;
        text-align: center;
      }

      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
      .chip {
        font-size: var(--t-micro);
        padding: 4px 10px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        opacity: 0.72;
      }
      button.chip:hover:not(:disabled) { opacity: 1; }
      button.chip.on {
        opacity: 1;
        border-color: var(--accent-text);
        color: var(--accent-text);
        background: var(--accent-soft);
      }
      button.chip.on:hover:not(:disabled) { background: var(--accent-soft); }

      textarea {
        width: 100%;
        font-family: inherit;
        font-size: var(--t-body);
        line-height: 1.5;
        padding: 8px 10px;
        border-radius: var(--r-ctl);
        border: 1px solid var(--line-strong);
        /* 别用 transparent：宿主 iframe 里的底色不由我们定，透明会让文字和背景撞色。 */
        background-color: var(--fill);
        color: inherit;
        min-height: 64px;
        resize: vertical;
        margin-bottom: 8px;
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-tint);
      }
      textarea::placeholder { color: inherit; opacity: 0.5; }

      /* 空状态不是留白：说清这里会长出什么，别让用户对着一句"还没有"猜。 */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 20px 12px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: var(--r-card);
        margin: 0;
      }
      .empty svg { opacity: 0.35; }
      .empty p { margin: 0; }
      .empty .t { font-size: var(--t-body); font-weight: 500; opacity: 0.85; }
      .empty .s { font-size: var(--t-small); opacity: 0.65; max-width: 26em; }

      .result:empty { display: none; }
      .result {
        margin-top: 16px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--fill);
        font-size: var(--t-body);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .result.error {
        border-color: var(--danger-line);
        background: var(--danger-soft);
        color: var(--danger);
      }

      .hint { font-size: var(--t-small); line-height: 1.6; opacity: 0.66; margin-top: 20px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--t-micro);
        padding: 1px 4px;
        border-radius: var(--r-chip);
        background: var(--fill);
      }

      /* 面板跑在宿主的 iframe 里，用户可能全局关掉了动效。这里的过渡纯是装饰，直接停掉。 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="4.5" width="17" height="15" rx="3.5"></rect>
          <path d="M7.5 9.5h9M7.5 13h5.5"></path>
        </svg>
      </span>
      <h1>对齐账本</h1>
      <span class="counts" id="counts" hidden></span>
      <button id="expand" class="primary" hidden>在侧边打开</button>
      <button id="refresh" title="刷新" aria-label="刷新" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </button>
    </header>

    <p class="notice" id="notice">正在与宿主握手…</p>
    <p class="where" id="where" hidden>
      <span id="whereName"></span>
      <button class="tiny" id="switchProject" hidden>切换</button>
    </p>
    <div class="pick" id="projects" hidden></div>

    <!-- 整份账本只在展开时渲染，收起时只留一张小卡片：历史消息会被宿主重新挂载，
         收起态若也画整份账本，上滑翻记录就会一路铺开一大块。 -->
    <div id="full">
      <div class="tabs" id="tabs">
        <button id="tabProject" class="on">本项目</button>
        <button id="tabCommon">通用账本</button>
      </div>

      <div id="projectPage">
        <p class="aside alert" id="hookNote" hidden></p>
        <section>
          <div class="head">
            <h2>生效中 <span class="n" id="activeCount"></span></h2>
            <button class="danger tiny" id="retireAll" hidden>全部退休</button>
          </div>
          <div class="bulk" id="bulk" hidden></div>
          <p class="aside" id="dropped" hidden></p>
          <div id="active">
            <!-- 「本项目」那一组的标题行，加号住在它右边——动作贴着它要作用的那份列表。
                 这一行与写作表单的位置由渲染定（renderProjectPage 每次重画都会把它们搬回来），
                 所以别把这里的先后当成最终样子。 -->
            <div class="head groupRow" id="projectGroup">
              <span class="group" id="projectGroupLabel">本项目</span>
              <button class="add" id="addOne" title="直接写一条（跳过表单）" aria-label="直接写一条">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
              </button>
            </div>
            <div class="bulk" id="writeOne" hidden></div>
          </div>
        </section>

        <section id="inactiveSection" hidden>
          <div class="head">
            <h2>
              <button class="fold" id="foldInactive" aria-expanded="false" aria-label="展开已失效"
                      title="展开">▸</button>
              已失效 <span class="n" id="inactiveCount"></span>
            </h2>
            <button class="tiny" id="archiveAll" hidden>归档失效</button>
          </div>
          <div class="bulk" id="bulkInactive" hidden></div>
          <div id="inactive"></div>
        </section>

        <p class="aside" id="archiveNote" hidden></p>

        <p class="hint">
          这里改的是<strong>已经落下的</strong>条目。新条目走对话里的原生表单（<code>rein_land</code>），不从这个面板落地。
        </p>
      </div>

      <div id="commonPage" hidden>
        <section>
          <div class="head">
            <h2>通用账本 <span class="n" id="commonCount"></span></h2>
            <button class="add" id="addCommon" title="直接写一条（跳过表单）" aria-label="直接写一条">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>
          <div class="bulk" id="commonWriteOne" hidden></div>
          <div id="commonActive"></div>
        </section>

        <section id="commonInactiveSection" hidden>
          <div class="head">
            <h2>
              <button class="fold" id="foldCommonInactive" aria-expanded="false" aria-label="展开已失效"
                      title="展开">▸</button>
              已失效 <span class="n" id="commonInactiveCount"></span>
            </h2>
          </div>
          <div id="commonInactive"></div>
        </section>

        <p class="hint">
          这本账<strong>不参与每轮注入</strong>。要让它生效，把一条<strong>引到某个项目里</strong>——
          引过去的是副本，两边各自独立：这里改了或者退休了，已经引出去的都不会跟着变。
        </p>
      </div>

      <div class="result" id="result"></div>
    </div>

    <script>
      (() => {
        const noticeEl = document.getElementById("notice");
        const whereEl = document.getElementById("where");
        const whereNameEl = document.getElementById("whereName");
        const switchEl = document.getElementById("switchProject");
        const projectsEl = document.getElementById("projects");
        const activeEl = document.getElementById("active");
        const inactiveEl = document.getElementById("inactive");
        const inactiveSection = document.getElementById("inactiveSection");
        const activeCountEl = document.getElementById("activeCount");
        const inactiveCountEl = document.getElementById("inactiveCount");
        const refreshEl = document.getElementById("refresh");
        const expandEl = document.getElementById("expand");
        const droppedEl = document.getElementById("dropped");
        const countsEl = document.getElementById("counts");
        const fullEl = document.getElementById("full");
        const bulkEl = document.getElementById("bulk");
        const bulkInactiveEl = document.getElementById("bulkInactive");
        const archiveNoteEl = document.getElementById("archiveNote");
        const hookNoteEl = document.getElementById("hookNote");
        const writeOneEl = document.getElementById("writeOne");
        const addOneEl = document.getElementById("addOne");
        const retireAllEl = document.getElementById("retireAll");
        const archiveAllEl = document.getElementById("archiveAll");
        const resultEl = document.getElementById("result");
        const tabProjectEl = document.getElementById("tabProject");
        const tabCommonEl = document.getElementById("tabCommon");
        const projectPageEl = document.getElementById("projectPage");
        const commonPageEl = document.getElementById("commonPage");
        const commonEl = document.getElementById("commonActive");
        const commonInactiveEl = document.getElementById("commonInactive");
        const commonInactiveSection = document.getElementById("commonInactiveSection");
        const commonCountEl = document.getElementById("commonCount");
        const commonInactiveCountEl = document.getElementById("commonInactiveCount");
        const commonWriteOneEl = document.getElementById("commonWriteOne");
        const addCommonEl = document.getElementById("addCommon");
        const foldInactiveEl = document.getElementById("foldInactive");
        const foldCommonInactiveEl = document.getElementById("foldCommonInactive");
        const projectGroupEl = document.getElementById("projectGroup");

        let nextId = 1;
        let hostReady = false;
        // 现在看的是哪一页。两页共用一套"编辑 / 确认 / 写作"状态——同时只看得见一页，
        // 换页时把它们清掉就行（见 switchPage），不必给每页各养一份。
        let page = "project";
        // 项目根有三种来路，面板得分开对待：
        // - 工具显式给的（模型按你所在的项目打开）→ 认死，刷新也只刷那一本；
        // - 你在这个面板里手选的 → 也认死（就是你要看它）；
        // - server 按"最近一次提问的项目"猜的（从侧栏入口打开时没人递根）→ 允许重新认，
        //   否则你切到别的项目再点刷新，它还停在原来那本账上。
        let rootFromTool = false;
        let manualRoot = null;
        // 面板只在"刚被 rein_open_ledger 打开的那一次"里认领展开侧栏；
        // 认领过的实例不再重复认领（历史回放也不会）。
        let claimed = false;
        let firstState = null;
        // 正在编辑的那条：{ id, statement, type }。null = 没有在编辑。
        let editing = null;
        // 「直接写一条」：输入框开着没有、里面写了什么、这条打算挂哪个标签。
        let writing = false;
        let writingText = "";
        let writingType = "";
        // 「原文」：读回来的正文按编号缓存，以及哪些条目的原文展开着。
        // 账本状态里**不带**这些——状态是给模型看的，原文是给用户看的，点开才去问。
        const evidenceText = new Map();
        const evidenceOpen = new Set();
        // 「已失效」收着还是开着。默认收着：那是账本的历史，多数时候没人要看，
        // 但也不该藏得找不着——计数一直摆在标题上。两页共用一个开关，那是同一种阅读
        // 偏好，不是两件事；换页/刷新都不重置它。
        let inactiveOpen = false;
        // 通用账本那一份：条目单独放（形状不一样，没有热块/归档/钩子），原文也单独缓存——
        // 两本账的编号会撞（都是 C-001），共用一张表就串了。
        const commonLedger = { items: [], active: 0, total: 0 };
        const commonEvidenceText = new Map();
        const commonEvidenceOpen = new Set();
        // 正在等"确认退休"的那条编号。null = 没有在等。
        let confirming = null;
        let displayMode = "inline";
        const pending = new Map();
        const state = { root: null, items: [], types: [], commonLabel: "", active: 0, total: 0 };

        function request(method, params) {
          const id = nextId++;
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          return new Promise((resolve) => pending.set(id, resolve));
        }

        function notify(method, params) {
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function labelOf(slug) {
          return state.types.find((type) => type.slug === slug)?.label ?? slug;
        }

        // 原文按页分家：两本账的编号会撞（都是 C-001），共用一张表就串了。
        const evidenceOpenFor = (which) => (which === "common" ? commonEvidenceOpen : evidenceOpen);
        const evidenceTextFor = (which) => (which === "common" ? commonEvidenceText : evidenceText);

        function isActive(item) {
          return item.status === "active";
        }

        /**
         * 这条是从通用账本引来的吗？看那个保留标签。
         *
         * 标签由 server 随状态一起递过来（state.commonLabel），面板不自己写死"通用账本"
         * 三个字——那句话的真源只有一处，面板再抄一份，改说法时就会漏。
         */
        function fromCommon(item) {
          return Boolean(state.commonLabel) && item.type === state.commonLabel;
        }

        /** "生效中"里的分组小标题。 */
        function groupHead(text) {
          const el = document.createElement("p");
          el.className = "group";
          el.textContent = text;
          return el;
        }

        /** 状态那一栏写给用户看：取代的有链，退休的就一个字。 */
        function statusText(item) {
          if (item.status === "retired") return "已退休";
          const match = /^superseded by (C-\d+)$/.exec(item.status);
          if (match) return `已由 ${match[1]} 取代`;
          return item.status;
        }

        function setNotice(text) {
          noticeEl.textContent = text ?? "";
          noticeEl.hidden = !text;
        }

        function setResult(text, isError = false) {
          resultEl.textContent = text ?? "";
          resultEl.className = isError ? "result error" : "result";
        }

        function button(text, handler, disabled = false) {
          const el = document.createElement("button");
          el.textContent = text;
          el.disabled = disabled;
          el.addEventListener("click", handler);
          return el;
        }

        /** 条目头上那一行：编号、类型或状态、日期。 */
        function metaRow(parts) {
          const meta = document.createElement("div");
          meta.className = "meta";
          for (const [className, text] of parts) {
            const span = document.createElement("span");
            span.className = className;
            span.textContent = text;
            meta.append(span);
          }
          return meta;
        }

        function renderActiveItem(item, page) {
          const card = document.createElement("article");
          card.className = editing?.id === item.id ? "item editing" : "item";

          const meta = metaRow([
            ["id", item.id],
            // 项目页上，从通用账本引来的那条把类型那格标出来——扫一眼就分得出。
            [page === "project" && fromCommon(item) ? "type foreign" : "type", labelOf(item.type)],
            ["date", item.date]
          ]);

          if (editing?.id === item.id) {
            const box = document.createElement("textarea");
            box.value = editing.statement;
            box.addEventListener("input", () => {
              editing.statement = box.value;
            });

            // 类型用一排小按钮，不用 <select>：原生的下拉在宿主的 iframe 里底色不由我们定，
            // 收起状态会撞色成一片空白。按钮没有这个问题，也更窄。
            const chips = document.createElement("div");
            chips.className = "chips";
            for (const type of state.types) {
              const chip = button(type.label, () => {
                editing.type = type.slug;
                for (const el of chips.children) el.classList.toggle("on", el.textContent === type.label);
              });
              chip.className = `chip${type.slug === editing.type ? " on" : ""}`;
              chips.append(chip);
            }

            const actions = document.createElement("div");
            actions.className = "actions";
            const supersede = button(
              "取代",
              () => saveItem(item, page, editing.statement, editing.type),
              !hostReady
            );
            supersede.className = "primary";
            actions.append(
              supersede,
              button("取消", () => {
                editing = null;
                render();
              })
            );

            card.append(meta, box, chips, actions);
            return card;
          }

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          // 退休不可逆，而且"退休"就挨着"改"，点错没有回头路——先要一次确认。
          // 不用 window.confirm()：面板跑在宿主的沙箱 iframe 里，弹窗可能被直接挡掉，
          // 那样这个按钮会变成"点了没反应"。
          if (confirming === item.id) {
            const warn = document.createElement("p");
            warn.className = "warn";
            warn.textContent =
              page === "common"
                ? "退休不可逆：这条在通用账本里不再生效，条目留在账里。已经引到项目里的那几份是副本，不受影响——要一起收，得去那几个项目里各退一次。"
                : "退休不可逆：这条不再每轮注入，它会留在账本的历史里。";

            const confirmActions = document.createElement("div");
            confirmActions.className = "actions";
            const yes = button("确认退休", () => retireItem(item, page), !hostReady);
            yes.className = "danger armed";
            confirmActions.append(
              yes,
              button("取消", () => {
                confirming = null;
                render();
              })
            );

            card.append(meta, statement, warn, confirmActions);
            return card;
          }

          const actions = document.createElement("div");
          actions.className = "actions";

          if (page === "common") {
            // 「引入」不多给一颗实心：面板里实心留给"就这么定"（表单的提交），
            // 一列卡片站满蓝块，重点反而没了。蓝色的那颗仍然是最常按的「修改」。
            actions.append(
              button("引入到本项目", () => importItem(item), !hostReady),
              editButton(item),
              retireButton(item)
            );
          } else if (fromCommon(item)) {
            // 引来的那条在项目页是只读的：措辞归通用账本管。就地改本地这份会让它跟源头分家，
            // 分家之后"这条是通用的"就成了假话。要改就过去改——那边改完，这条是另一条了，
            // 得重新引（这也是复制模型的代价，写在面上比藏起来强）。
            actions.append(button("去通用账本改", () => switchPage("common"), !hostReady));
          } else {
            actions.append(
              editButton(item),
              retireButton(item),
              button("推到通用账本", () => promoteItem(item), !hostReady)
            );
          }

          // 原文：这条结论当初从哪来的。每条都给入口——没有原文的（手写的、更早落的）点开会
          // 说明它是"外部写入"，而不是留一块空白。
          const open = evidenceOpenFor(page);
          const cache = evidenceTextFor(page);
          const origin = button(open.has(item.id) ? "收起原文" : "原文", () => {
            toggleEvidence(page, item.id);
          }, !hostReady);
          origin.className = "tiny end";
          actions.append(origin);

          card.append(meta, statement);
          if (open.has(item.id) && cache.has(item.id)) {
            const origin = document.createElement("p");
            origin.className = "origin";
            origin.textContent = cache.get(item.id);
            card.append(origin);
          }
          card.append(actions);
          return card;
        }

        function editButton(item) {
          const edit = button("修改", () => {
            editing = { id: item.id, statement: item.statement, type: item.type };
            confirming = null;
            setResult("");
            render();
          }, !hostReady);
          edit.className = "edit";
          return edit;
        }

        function retireButton(item) {
          const retire = button("退休", () => {
            confirming = item.id;
            setResult("");
            render();
          }, !hostReady);
          retire.className = "danger";
          return retire;
        }

        function renderInactiveItem(item) {
          const card = document.createElement("article");
          card.className = "item inactive";

          card.append(
            metaRow([
              ["id", item.id],
              ["state", statusText(item)],
              ["date", item.date]
            ])
          );

          const statement = document.createElement("p");
          statement.className = "statement";
          statement.textContent = item.statement;

          card.append(statement);
          return card;
        }

        /** 空状态不是留白：说清这里会长出什么。两页各说各的，所以文案是参数。 */
        function emptyState(titleText, subText) {
          const wrap = document.createElement("div");
          wrap.className = "empty";

          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("width", "22");
          svg.setAttribute("height", "22");
          svg.setAttribute("fill", "none");
          svg.setAttribute("stroke", "currentColor");
          svg.setAttribute("stroke-width", "1.6");
          svg.setAttribute("stroke-linecap", "round");
          svg.setAttribute("stroke-linejoin", "round");
          svg.setAttribute("aria-hidden", "true");
          const frame = document.createElementNS(ns, "rect");
          frame.setAttribute("x", "3.5");
          frame.setAttribute("y", "5");
          frame.setAttribute("width", "17");
          frame.setAttribute("height", "14");
          frame.setAttribute("rx", "3.5");
          const l1 = document.createElementNS(ns, "path");
          l1.setAttribute("d", "M7.5 10h9");
          const l2 = document.createElementNS(ns, "path");
          l2.setAttribute("d", "M7.5 13.5h5");
          svg.append(frame, l1, l2);

          const title = document.createElement("p");
          title.className = "t";
          title.textContent = titleText;

          const sub = document.createElement("p");
          sub.className = "s";
          sub.textContent = subText;

          wrap.append(svg, title, sub);
          return wrap;
        }

        /** 顶栏那句"项目：xxx"——别让人对着另一个项目的条目猜自己看的是哪本账。 */
        function showWhere() {
          const root = state.root ?? null;
          if (!root) {
            whereEl.hidden = true;
            whereNameEl.textContent = "";
            whereEl.title = "";
            switchEl.hidden = true;
            projectsEl.hidden = true;
            return;
          }

          const parts = String(root).split("/").filter(Boolean);
          whereNameEl.textContent = `项目：${parts[parts.length - 1] ?? root}`;
          whereEl.title = rootFromTool
            ? root
            : `${root}\n（从侧栏入口打开时按"最近一次提问的项目"认；认错了点右边「切换」）`;
          whereEl.hidden = false;
          // 工具显式给了根的那一次不给切换（那是模型按你所在的项目打开的）；其余情况给手动开关。
          switchEl.hidden = rootFromTool;
        }

        function render() {
          renderTabs();
          applyFold();
          if (page === "common") renderCommonPage();
          else renderProjectPage();
        }

        /**
         * 两页的「已失效」共用同一个折叠开关。
         *
         * 收起来时只藏列表，标题与计数照留着——"有 3 条已失效"这件事本身是要让你看见的，
         * 不看见的只是那 3 张卡。
         */
        function applyFold() {
          for (const [toggle, list] of [
            [foldInactiveEl, inactiveEl],
            [foldCommonInactiveEl, commonInactiveEl]
          ]) {
            toggle.setAttribute("aria-expanded", String(inactiveOpen));
            toggle.title = inactiveOpen ? "收起" : "展开";
            toggle.setAttribute("aria-label", inactiveOpen ? "收起已失效" : "展开已失效");
            list.hidden = !inactiveOpen;
          }
        }

        /** 两页的显示与隐藏。收起态看不见页签——整块 #full 都被藏了。 */
        function renderTabs() {
          tabProjectEl.classList.toggle("on", page === "project");
          tabCommonEl.classList.toggle("on", page === "common");
          projectPageEl.hidden = page !== "project";
          commonPageEl.hidden = page !== "common";
        }

        function renderProjectPage() {
          const active = state.items.filter(isActive).reverse();
          const inactive = state.items.filter((item) => !isActive(item)).reverse();

          showWhere();
          activeEl.textContent = "";
          inactiveEl.textContent = "";

          // "生效中"分两组：从通用账本引来的在前，本项目自己的在后。
          const borrowed = active.filter(fromCommon);
          const mine = active.filter((item) => !fromCommon(item));

          if (borrowed.length > 0) {
            // 小标题用保留标签本身，不另抄一份说法。
            activeEl.append(groupHead(state.commonLabel));
            for (const item of borrowed) activeEl.append(renderActiveItem(item, "project"));
          }

          // 本项目那一组：标题行上带着「直接写一条」的加号，写作表单跟在它下面。这两块是标记
          // 里就有的静态节点，靠 append 搬回来——#active 每次重画都被清空，"搬回来"和"放进去"
          // 是同一个动作。它们永远在，所以账本空着的时候加号也有地方待。
          activeEl.append(projectGroupEl, writeOneEl);

          if (active.length === 0) {
            activeEl.append(emptyState("还没有生效的已确认项", "对话里落地的条目会出现在这里。"));
          } else {
            for (const item of mine) activeEl.append(renderActiveItem(item, "project"));
          }

          inactiveSection.hidden = inactive.length === 0;
          for (const item of inactive) inactiveEl.append(renderInactiveItem(item));

          if (hostReady) {
            activeCountEl.textContent = String(active.length);
            inactiveCountEl.textContent = inactive.length === 0 ? "" : String(inactive.length);
          }
          renderBulk(active.length, borrowed.length);
          renderBulkInactive(inactive.length);
          renderWriteForm("project");
          renderCounts();
        }

        function renderCommonPage() {
          const active = commonLedger.items.filter(isActive).reverse();
          const inactive = commonLedger.items.filter((item) => !isActive(item)).reverse();

          showWhere();
          commonEl.textContent = "";
          commonInactiveEl.textContent = "";

          if (active.length === 0) {
            commonEl.append(
              emptyState("通用账本还是空的", "在这里直接写一条，或者把某个项目里的一条推上来。")
            );
          } else {
            for (const item of active) commonEl.append(renderActiveItem(item, "common"));
          }

          commonInactiveSection.hidden = inactive.length === 0;
          for (const item of inactive) commonInactiveEl.append(renderInactiveItem(item));

          if (hostReady) {
            commonCountEl.textContent = String(active.length);
            commonInactiveCountEl.textContent =
              inactive.length === 0 ? "" : String(inactive.length);
          }
          renderWriteForm("common");
        }

        /** 侧栏只在两处开：刚打开那一次的认领，以及用户点「在侧边打开」。 */
        async function requestDisplay(mode) {
          const response = await withTimeout(
            request("ui/request-display-mode", { mode }),
            2000
          );
          displayMode = response?.result?.mode ?? displayMode;
          syncMode();
          if (mode === "fullscreen" && displayMode !== "fullscreen") {
            setNotice("宿主没有展开面板，用面板右上角的展开按钮。");
          }
          return displayMode;
        }

        /**
         * 两种形态：展开时是整份账本，收起时只剩一张入口卡片。
         *
         * 收起态**必须小巧**：主线里留下的那份会被宿主重新挂载，整份账本摊在对话里，
         * 上滑翻记录就会一路铺开。
         */
        function syncMode() {
          const compact = displayMode !== "fullscreen";
          fullEl.hidden = compact;
          countsEl.hidden = !compact;
          expandEl.hidden = !compact;
          refreshEl.hidden = compact;
          renderCounts();
        }

        /** 收起态那一行：几张生效、几张已失效。 */
        function renderCounts() {
          if (!hostReady || countsEl.hidden) return;
          const active = state.items.filter(isActive).length;
          const inactive = state.items.length - active;
          countsEl.textContent =
            inactive > 0 ? `${active} 条生效 · ${inactive} 条已失效` : `${active} 条生效`;
        }

        /**
         * 这一次该不该把侧栏抢过来？
         *
         * 面板每次**挂载**都会跑一遍这段脚本——包括你上滑聊天记录、宿主把历史里的面板
         * 重新挂载起来的时候。所以展开做成一次性认领：只有刚被 rein_open_ledger 打开的
         * 那一次取得到 true，历史回放取不到。
         */
        async function claimOpen() {
          if (claimed || !state.root) return;
          claimed = true;

          // 用裸 request，不走 call()：历史回放里这次调用可能被宿主拒掉，
          // 那不该在面板上留一条报错，让人以为面板坏了。
          const response = await request("tools/call", {
            name: "rein_take_open",
            arguments: { root: state.root }
          });

          if (response?.result?.structuredContent?.open === true) {
            setNotice("");
            await requestDisplay("fullscreen");
          }
        }

        /** 等到第一次状态到达（历史回放常常不给状态）。 */
        function waitForState(ms) {
          if (state.root) return Promise.resolve(true);
          return new Promise((resolve) => {
            firstState = resolve;
            setTimeout(() => {
              if (firstState === resolve) {
                firstState = null;
                resolve(false);
              }
            }, ms);
          });
        }

        /** 上限之外的生效项仍在账本里，但不再每轮注入——这件事要写在明面上。 */
        function showHotBlockNote(hotBlock) {
          if (!(hotBlock?.dropped > 0)) {
            droppedEl.hidden = true;
            droppedEl.textContent = "";
            return;
          }
          droppedEl.textContent = `其中 ${hotBlock.dropped} 条超出热块上限（${hotBlock.maxItems}），仍在账本里，只是不再每轮注入。`;
          droppedEl.hidden = false;
        }

        /**
         * 工具回传的 structuredContent 就是完整账本，直接照着重渲染。
         *
         * 两本账的 payload 长得像，靠 `book` 分：通用那本只有条目与计数，热块、归档、
         * 钩子三样都只属于项目账本——它们讲的是"这个项目每轮注入什么"。
         */
        function applyState(payload) {
          if (!payload) return;
          if (payload.root) state.root = payload.root;
          // 根是哪来的，server 会说：显式给的才认死，猜的允许刷新时重新认。
          if (typeof payload.rootSource === "string") rootFromTool = payload.rootSource === "explicit";
          if (Array.isArray(payload.types)) state.types = payload.types;
          if (typeof payload.commonLabel === "string") state.commonLabel = payload.commonLabel;

          if (payload.book === "common") {
            if (Array.isArray(payload.items)) commonLedger.items = payload.items;
            commonLedger.active = payload.active ?? 0;
            commonLedger.total = payload.total ?? commonLedger.items.length;
            // 账本一变，原文的展开与缓存就作废（取代之后编号都换了）。
            commonEvidenceText.clear();
            commonEvidenceOpen.clear();
            editing = null;
            confirming = null;
            render();

            if (typeof payload.message === "string" && payload.message) {
              setResult(payload.message);
            }
            return;
          }

          if (Array.isArray(payload.items)) state.items = payload.items;
          evidenceText.clear();
          evidenceOpen.clear();
          if (payload.hotBlock) showHotBlockNote(payload.hotBlock);
          if (payload.archived) renderArchiveNote(payload.archived);
          showHookNote(payload.hook);
          editing = null;
          confirming = null;
          render();

          if (typeof payload.message === "string" && payload.message) {
            setResult(payload.message);
          }

          if (firstState && state.root) {
            const arrived = firstState;
            firstState = null;
            arrived(true);
          }
        }

        /**
         * 「原文」：这条结论当初是从哪来的。
         *
         * 原文只存在本地、账本里没有，所以点开才现读——不塞进每次状态里，账本再大也不拖。
         * 没有原文时服务端会回一句「外部写入」的说明，照原样显示；只有真的读失败才收回去。
         *
         * 两本账各调各的读法：项目那边是 `rein_evidence`（带 id），通用那边是 `rein_common`
         * 带 `evidence`。**不走 call()**——那段会 applyState，而这是一次纯粹的读。
         */
        async function toggleEvidence(which, id) {
          const open = evidenceOpenFor(which);
          const cache = evidenceTextFor(which);

          if (open.has(id)) {
            open.delete(id);
            render();
            return;
          }
          open.add(id);

          if (!cache.has(id)) {
            setResult("正在读原文…");
            const response = await request("tools/call", {
              name: which === "common" ? "rein_common" : "rein_evidence",
              arguments:
                which === "common"
                  ? { evidence: id, root: state.root }
                  : { id, root: state.root }
            });
            const text = response?.result?.structuredContent?.text ?? null;
            if (response?.error || !text) {
              open.delete(id);
              setResult(`失败：${response?.error?.message ?? "没拿到原文。"}`, true);
              render();
              return;
            }
            cache.set(id, text);
            setResult("");
          }
          render();
        }

        /**
         * 调一个工具。`dropRoot` 是给"重新认项目"用的：不传 root，让 server 重新解析
         * （也就是按最近一次提问的项目），而不是钉在面板手里那个根上。
         */
        async function call(name, args, { dropRoot = false } = {}) {
          const response = await request("tools/call", {
            name,
            arguments: dropRoot ? { ...args } : { ...args, root: state.root ?? undefined }
          });

          if (response?.error) {
            setResult(`失败：${response.error.message}`, true);
            return null;
          }

          const payload = response?.result?.structuredContent ?? null;
          applyState(payload);
          return payload;
        }

        /**
         * 刷新。两种情形不一样：面板是工具打开的（模型知道项目根）就刷新那一本；
         * 是从侧栏入口打开的（没人给根）就重新认一次——不然你切了项目，它还停在上一个。
         */
        function refresh() {
          // 通用那本不认项目根：它一本账一个固定位置，切过去就现读一次。
          if (page === "common") return call("rein_common", {});
          // 认死的那种（工具给的、或者你手选的）就刷那一本；猜的重新认一次。
          if (rootFromTool || manualRoot) return call("rein_list", {});
          return call("rein_list", {}, { dropRoot: true });
        }

        /**
         * 换页。
         *
         * 手上那点临时状态（编辑、确认退休、正在写的那段字）只对原来那页有意义，换页清掉。
         * 换完立刻读一次新那页——通用账本不跟着项目变，切过去要现取；项目那本也一样
         * （你可能在对话里改过它）。
         */
        function switchPage(next) {
          if (page === next) return;
          page = next;
          editing = null;
          confirming = null;
          writing = false;
          writingText = "";
          projectsEl.hidden = true;
          setResult("");
          render();
          refresh();
        }

        /** 猜不准时的手动切换：把最近提问过的项目摆出来，点一个就看它。 */
        async function openProjectPicker() {
          const payload = await call("rein_projects", {});
          const projects = Array.isArray(payload?.projects) ? payload.projects : [];

          projectsEl.textContent = "";
          for (const entry of projects) {
            const chip = button(entry.name, () => {
              // 手选就是"我要看这个"：认死它，直到你再切一次。
              manualRoot = entry.path;
              state.root = entry.path;
              projectsEl.hidden = true;
              refresh();
            });
            chip.className = entry.path === state.root ? "chip on" : "chip";
            chip.title = entry.path;
            projectsEl.append(chip);
          }
          projectsEl.hidden = false;
        }

        // 改与退休两页各有一套工具（rein_edit / rein_common_edit），规矩一样、账本不一样。
        async function saveItem(item, which, statement, type) {
          setResult("正在改…");
          await call(which === "common" ? "rein_common_edit" : "rein_edit", {
            id: item.id,
            statement,
            type
          });
        }

        async function retireItem(item, which) {
          setResult("正在退休…");
          await call(which === "common" ? "rein_common_edit" : "rein_edit", {
            id: item.id,
            retire: true
          });
        }

        /** 项目里的一条 → 通用账本。回来的状态是通用那本，所以这一页不用重画。 */
        async function promoteItem(item) {
          setResult("正在推到通用账本…");
          await call("rein_promote", { id: item.id });
        }

        /** 通用账本里的一条 → 当前这个项目。回来的是项目那本的状态，切过去就能看见。 */
        async function importItem(item) {
          setResult("正在引入…");
          await call("rein_import", { id: item.id });
        }

        async function retireEverything() {
          setResult("正在退休…");
          await call("rein_retire_all", {});
        }

        async function archiveEverything() {
          setResult("正在归档…");
          await call("rein_archive", {});
        }

        /**
         * 已失效区标题行上的「归档失效」，以及点过之后落下来的确认块。
         *
         * 归档**不是**删除（条目只是换个文件放），所以这里不用红色——红色留给不可逆的退休。
         */
        function renderBulkInactive(inactiveCount) {
          // 收起来的时候不给「归档失效」：对着一份你看不见的列表动手，正是这个确认块要防的事。
          const ready = hostReady && inactiveCount > 0 && inactiveOpen;
          archiveAllEl.hidden = !ready || confirming === "@archive";
          bulkInactiveEl.textContent = "";
          bulkInactiveEl.hidden = !(ready && confirming === "@archive");
          if (bulkInactiveEl.hidden) return;

          const warn = document.createElement("p");
          warn.className = "note";
          warn.textContent = `这 ${inactiveCount} 条会从账本挪进 ALIGNMENT-ARCHIVE.md。一条不删，只是不再列在这里（要看历史就打开那个文件）。`;

          const actions = document.createElement("div");
          actions.className = "actions";
          const go = button("确认归档", archiveEverything, !hostReady);
          go.className = "primary";
          actions.append(
            go,
            button("取消", () => {
              confirming = null;
              render();
            })
          );

          bulkInactiveEl.append(warn, actions);
        }

        /** 归档过多少条：面板不列它们，但得让人知道历史去哪儿了。 */
        function renderArchiveNote(archived) {
          const count = archived?.count ?? 0;
          archiveNoteEl.hidden = !(count > 0);
          archiveNoteEl.textContent = count > 0 ? `已归档 ${count} 条，不再列在这里（见 ALIGNMENT-ARCHIVE.md）。` : "";
        }

        /**
         * 钩子最容易静默失效（装完没重启、重装后没重新信任）。面板把这件事说出来，
         * 别让它悄悄停掉还装没事。
         */
        function showHookNote(hook) {
          if (!hook || hook.recent === true) {
            hookNoteEl.hidden = true;
            hookNoteEl.textContent = "";
            return;
          }
          const detail = hook.ageMs == null ? "还没见它跑过" : `最后一次痕迹是 ${agoText(hook.ageMs)}前`;
          hookNoteEl.textContent = `每轮注入的钩子好像没在运行（${detail}）。刚装好、重装或升级过的话，重启 app，再去「设置 → Hooks」把 rein 的钩子过一遍信任。`;
          hookNoteEl.hidden = false;
        }

        function agoText(ms) {
          const seconds = Math.max(0, Math.round(ms / 1000));
          if (seconds < 90) return "刚刚";
          const minutes = Math.round(seconds / 60);
          if (minutes < 90) return `${minutes} 分钟`;
          const hours = Math.round(minutes / 60);
          return hours < 36 ? `${hours} 小时` : `${Math.round(hours / 24)} 天`;
        }

        /**
         * 「直接写一条」：跳过表单，把一句话直接写进账本。**只有面板上才有**——
         * 模型工具面上没有它（见 server 里 rein_one 的 _meta），所以模型绕不过表单。
         *
         * 入口是标题行上那个加号（静态写在 HTML 里），这里只管表单那一块：
         * 表单开着的时候加号收起来，避免两个入口同时站着。
         */
        function renderWriteForm(which) {
          const form = which === "common" ? commonWriteOneEl : writeOneEl;
          const add = which === "common" ? addCommonEl : addOneEl;

          form.textContent = "";
          add.hidden = !hostReady || writing;
          form.hidden = !hostReady || !writing;
          if (form.hidden) return;

          const note = document.createElement("p");
          note.className = "note";
          // 这两句必须不一样：在项目页写一条就生效，在通用页写一条**不生效**。
          // 第一次用的人一定会在这儿搞混。
          note.textContent =
            which === "common"
              ? "跳过表单、直接写进通用账本。它不会每轮带上——要让它生效，还得把它引到某个项目里。"
              : "跳过表单、直接写进账本，以后每轮都带上。只适合十拿九稳的长期前提，别拿它写命令式的话。";

          const box = document.createElement("textarea");
          box.value = writingText;
          box.placeholder = "写一句话…";
          box.addEventListener("input", () => {
            writingText = box.value;
          });

          // 标签：跟条目上的「修改」一样摆一排 chips。默认停在第一个，不想选就直接写。
          const chips = document.createElement("div");
          chips.className = "chips";
          for (const type of state.types) {
            const chip = button(type.label, () => {
              writingType = type.slug;
              for (const el of chips.children) el.classList.toggle("on", el.textContent === type.label);
            });
            chip.className = `chip${type.slug === writingType ? " on" : ""}`;
            chips.append(chip);
          }

          const actions = document.createElement("div");
          actions.className = "actions";
          const go = button(
            which === "common" ? "写进通用账本" : "写进账本",
            () => writeOne(which),
            !hostReady
          );
          go.className = "primary";
          actions.append(
            go,
            button("取消", () => {
              writing = false;
              writingText = "";
              render();
            })
          );

          form.append(note, box, chips, actions);
        }

        async function writeOne(which) {
          const statement = writingText.trim();
          if (!statement) {
            setResult("先写一句。", true);
            return;
          }

          setResult("正在写…");
          // 两页各调各的：项目那本写进去就生效，通用那本写进去只是入库。
          const payload =
            which === "common"
              ? await call("rein_common_one", { statement, type: writingType })
              : await call("rein_one", { statement, type: writingType });

          if (payload?.ok) {
            writing = false;
            writingText = "";
          }
          render();
        }

        /**
         * 生效区标题行上的「全部退休」，以及点过之后落下来的确认块。
         *
         * 批量退休是不可逆的，所以和单条一样先要一次确认——`confirming` 用 `*` 当哨兵，
         * 单条用的是条目编号，两者不会撞。确认期间把标题行上那颗收起来，免得连点。
         */
        function renderBulk(activeCount, borrowedCount) {
          const ready = hostReady && activeCount > 0;
          retireAllEl.hidden = !ready || confirming === "*";
          bulkEl.textContent = "";
          bulkEl.hidden = !(ready && confirming === "*");
          if (bulkEl.hidden) return;

          const warn = document.createElement("p");
          warn.className = "warn";
          warn.textContent =
            borrowedCount > 0
              ? `全部退休不可逆：${activeCount} 条生效项会一起变成「已退休」，热块从下一轮起就空了。其中 ${borrowedCount} 条是从通用账本引来的——退掉的只是本项目这份副本，通用账本里那条不受影响。条目一条不删，但没有恢复动作。`
              : `全部退休不可逆：${activeCount} 条生效项会一起变成「已退休」，热块从下一轮起就空了。条目一条不删，都留在账本里——但没有恢复动作。`;

          const actions = document.createElement("div");
          actions.className = "actions";
          const yes = button("确认全部退休", retireEverything, !hostReady);
          yes.className = "danger armed tiny";
          actions.append(
            yes,
            button("取消", () => {
              confirming = null;
              render();
            })
          );

          bulkEl.append(warn, actions);
        }

        // 刷新走 rein_list（只读）而不是 rein_open_ledger：后者会放一个新的"可展开"
        // 待取标记，那等于每次点刷新都重新抢一次侧栏。
        refreshEl.addEventListener("click", () => refresh());
        switchEl.addEventListener("click", () => openProjectPicker());
        tabProjectEl.addEventListener("click", () => switchPage("project"));
        tabCommonEl.addEventListener("click", () => switchPage("common"));

        // 从侧栏挂着的面板不会因为你切项目就重新挂载，也就不会重新取一次状态。所以
        // 窗口重新可见时补一次——只在侧栏形态下补（对话里那张卡片按原样保持安静）。
        document.addEventListener("visibilitychange", () => {
          // 正在编辑/写作/确认时别自动刷新：状态一到手就会重渲染，正在打的那段字会没。
          const busy = editing !== null || writing || confirming !== null;
          if (
            document.visibilityState === "visible" &&
            hostReady &&
            displayMode === "fullscreen" &&
            !busy
          ) {
            refresh();
          }
        });

        expandEl.addEventListener("click", () => requestDisplay("fullscreen"));

        // 标题行上那几颗：加一条（在「本项目」那一组的行上）、全部退休、归档失效。
        // 加号直接开表单；后两颗只是把 confirming 点上，确认块交给 render 画。
        addOneEl.addEventListener("click", () => {
          writing = true;
          writingType = state.types[0]?.slug ?? "";
          setResult("");
          render();
        });

        addCommonEl.addEventListener("click", () => {
          writing = true;
          writingType = state.types[0]?.slug ?? "";
          setResult("");
          render();
        });

        retireAllEl.addEventListener("click", () => {
          confirming = "*";
          setResult("");
          render();
        });

        archiveAllEl.addEventListener("click", () => {
          confirming = "@archive";
          setResult("");
          render();
        });

        foldInactiveEl.addEventListener("click", () => {
          inactiveOpen = !inactiveOpen;
          render();
        });

        foldCommonInactiveEl.addEventListener("click", () => {
          inactiveOpen = !inactiveOpen;
          render();
        });

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;

          if (data.id !== undefined && pending.has(data.id)) {
            const resolve = pending.get(data.id);
            pending.delete(data.id);
            resolve(data);
            return;
          }

          if (data.method === "ui/notifications/tool-result") {
            applyState(data.params?.structuredContent);
            return;
          }

          // 宿主告诉我们展示方式变了（用户在 inline 与 fullscreen 之间切）。
          if (data.method === "ui/notifications/host-context-changed") {
            const next = data.params?.displayMode;
            if (typeof next === "string") {
              displayMode = next;
              syncMode();
            }
          }
        });

        function withTimeout(promise, ms) {
          return Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve(null), ms))
          ]);
        }

        /** 没有宿主时别装作能用——把原因说出来，别让人对着一堆死按钮猜。 */
        function noHost(message) {
          hostReady = false;
          setNotice(message);
          refreshEl.disabled = true;
          render();
        }

        (async () => {
          if (window.parent === window) {
            noHost("这里没有 MCP 宿主。这个面板要由 Agent 调 rein_open_ledger 打开，不能当普通网页打开。");
            return;
          }

          const response = await withTimeout(
            request("ui/initialize", {
              // 版本号是占位符：server 把这份面板递出去时会换成插件清单里的真版本号。
              appInfo: { name: "rein-panel", version: "__REIN_VERSION__" },
              appCapabilities: {},
              protocolVersion: "2025-11-21"
            }),
            2000
          );

          if (!response?.result?.protocolVersion) {
            noHost("宿主没有回应握手。这个面板要由 Agent 调 rein_open_ledger 打开。");
            return;
          }

          hostReady = true;
          // 宿主在握手时就说了"这是侧栏里的 app，还是对话里的一张卡片"：从 UI 入口点直接
          // 打开是前者，上滑聊天记录被重新挂载是后者。先照它定形态，别先画成卡片再纠正。
          const opening = response?.result?.hostContext?.displayMode ?? response?.result?.displayMode;
          if (typeof opening === "string") displayMode = opening;

          notify("ui/notifications/initialized", {});
          refreshEl.disabled = false;
          setNotice("");
          syncMode();
          render();

          // 等第一次状态到达：由工具打开的那一次，宿主会把账本随工具结果一起递过来。
          // 没等到就不认领侧栏——连项目根都不知道，去抢开一个空面板没有意义。
          const arrived = await waitForState(1200);
          if (arrived) {
            // 根认不认死由 state 里的 rootSource 说了算（见 applyState）——宿主打开入口时
            // 也会替用户调一次工具，那次没有根，不能当成"模型知道你在哪个项目"。
            await claimOpen();
            return;
          }

          // 没等到 = 这次是**从 UI 入口直接打开**的（侧栏 app、或 codex:// 链接）：没有工具
          // 调用，也就没人把账本递过来。自己去取一次；root 不传，server 会按"最近一次提问
          // 的项目"解析。只在侧栏形态下补取——对话里那张卡片按原样保持安静，免得它拿着
          // 当前项目去渲染一段历史。
          if (displayMode === "fullscreen") await refresh();
        })();
      })();
    </script>
  </body>
</html>
